<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="birdGradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="70%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#651FFF" />
    </radialGradient>
    <filter id="elegantGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feFlood flood-color="#64FFDA" flood-opacity="0.6" />
      <feComposite in2="blur" operator="in" />
      <feComposite in="SourceGraphic" />
    </filter>
  </defs>
  
  <g transform="translate(30, 40) scale(1.2)" class="hummingbird">
    <!-- Body -->
    <path d="M25,15 C35,12 40,15 38,20 C36,25 30,28 20,30 C15,32 10,30 8,25 C6,20 10,16 16,15 C20,14 22,15 25,15 Z" 
          fill="url(#birdGradient2)" filter="url(#elegantGlow2)" />
    
    <!-- Head -->
    <circle cx="37" cy="20" r="5" fill="#7C4DFF" />
    
    <!-- Beak -->
    <path d="M42,20 L50,19 L42,21 Z" fill="#64FFDA" />
    
    <!-- Wing (up position) -->
    <path id="wing" d="M15,18 C20,15 24,14 28,13 C25,15 22,17 20,19 C18,21 15,20 15,18 Z" 
          fill="#5E35B1" opacity="0.8" />
    
    <!-- Secondary Wing -->
    <path class="secondaryWing" d="M18,20 C22,17 25,16 28,15 C26,17 24,19 22,21 C20,22 18,22 18,20 Z" 
          fill="#5E35B1" opacity="0.6" />
    
    <!-- Tail -->
    <path d="M8,25 C5,26 4,24 5,22 C6,20 8,19 10,18" 
          fill="none" stroke="#64FFDA" stroke-width="1.5" />
  </g>
</svg> 