<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients, filters and patterns -->
  <defs>
    <!-- Rich blue gradient for nodes -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="70%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </radialGradient>
    
    <!-- Modern purplish gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2962FF" />
      <stop offset="50%" stop-color="#3D5AFE" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>
    
    <!-- Futuristic tagline gradient -->
    <linearGradient id="taglineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
    
    <!-- Enhanced glow filter for nodes -->
    <filter id="elegantGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feFlood flood-color="#64FFDA" flood-opacity="0.6" />
      <feComposite in2="blur" operator="in" />
      <feComposite in="SourceGraphic" />
    </filter>
    
    <!-- Digital particle system pattern -->
    <pattern id="nanoPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.8" fill="#64FFDA" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="10" r="0.6" fill="#64FFDA" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="25" cy="5" r="0.7" fill="#1E88E5" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="35" cy="15" r="0.5" fill="#1E88E5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="10" cy="25" r="0.7" fill="#651FFF" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="20" cy="30" r="0.5" fill="#651FFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="30" cy="25" r="0.6" fill="#3D5AFE" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.2s" repeatCount="indefinite" />
      </circle>
    </pattern>
    
    <!-- Line animation with pulse -->
    <linearGradient id="lineGradient">
      <stop offset="0%" stop-color="#00BFA5" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00BFA5" stop-opacity="0.1" />
      <animate attributeName="x1" from="0%" to="100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Code pattern background -->
    <pattern id="codePattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <text x="0" y="8" font-family="monospace" font-size="5" fill="#64FFDA" opacity="0.15">if(x){</text>
      <text x="0" y="16" font-family="monospace" font-size="5" fill="#3D5AFE" opacity="0.15">model.fit</text>
      <text x="0" y="24" font-family="monospace" font-size="5" fill="#651FFF" opacity="0.15">while()</text>
      <text x="0" y="32" font-family="monospace" font-size="5" fill="#1E88E5" opacity="0.15">return</text>
      <text x="0" y="40" font-family="monospace" font-size="5" fill="#00BFA5" opacity="0.15">async{}</text>
    </pattern>
    
    <!-- Circuit pattern for background -->
    <pattern id="circuitPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M10,0 L10,10 M0,10 L60,10 M20,10 L20,30 M0,30 L60,30 M40,30 L40,50 M0,50 L60,50" 
        stroke="#64FFDA" stroke-width="0.5" opacity="0.15" stroke-dasharray="1,3" />
    </pattern>
  </defs>
  
  <!-- Background elements -->
  <rect x="0" y="0" width="300" height="100" fill="url(#nanoPattern)" opacity="0.3" />
  <rect x="0" y="0" width="300" height="100" fill="url(#codePattern)" opacity="0.2" />
  <rect x="0" y="0" width="300" height="100" fill="url(#circuitPattern)" opacity="0.2" />
  
  <!-- Programmable node network -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0.4" stroke-dasharray="1 2">
    <animate attributeName="r" values="42;43;42" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Core programmable unit -->
  <path d="M30,50 L40,67 L60,67 L70,50 L60,33 L40,33 Z" fill="#111C24" opacity="0.7" filter="url(#elegantGlow)" />
  
  <!-- Programmable model representation -->
  <rect x="43" y="43" width="14" height="14" rx="2" fill="#111C24" stroke="url(#textGradient)" stroke-width="0.5" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
  </rect>
  <path d="M45,47 L55,47 M45,50 L55,50 M45,53 L55,53" stroke="#64FFDA" stroke-width="0.7" opacity="0.9" />
  <text x="46" y="58" fill="#64FFDA" font-family="monospace" font-size="4" opacity="0.9">01</text>
  
  <!-- Domain-specific nodes -->
  <circle cx="30" cy="50" r="5.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)">
    <animate attributeName="r" values="5.5;6;5.5" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="70" cy="20" r="3.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)">
    <animate attributeName="r" values="3.5;4;3.5" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="70" cy="80" r="3.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)">
    <animate attributeName="r" values="3.5;4;3.5" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Specialized model nodes -->
  <circle cx="50" cy="30" r="2.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)">
    <animate attributeName="r" values="2.5;2.8;2.5" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="50" cy="70" r="2.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)">
    <animate attributeName="r" values="2.5;2.8;2.5" dur="3.2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Dynamic connections -->
  <line x1="30" y1="50" x2="70" y2="20" stroke="url(#lineGradient)" stroke-width="1.8" />
  <line x1="30" y1="50" x2="70" y2="80" stroke="url(#lineGradient)" stroke-width="1.8" />
  <line x1="70" y1="20" x2="70" y2="80" stroke="url(#lineGradient)" stroke-width="1.8" />
  
  <!-- Domain connections -->
  <line x1="30" y1="50" x2="50" y2="30" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="50" y1="30" x2="70" y2="20" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="30" y1="50" x2="50" y2="70" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="50" y1="70" x2="70" y2="80" stroke="url(#lineGradient)" stroke-width="1.5" />
  
  <!-- Logo text with modern styling -->
  <text x="95" y="55" fill="url(#textGradient)" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0.5">
    <tspan>nanominds</tspan><tspan fill="#64FFDA" font-weight="400">.ai</tspan>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="4s" repeatCount="indefinite" />
  </text>
  
  <!-- Programmable Intelligence tagline -->
  <text x="98" y="72" fill="url(#taglineGradient)" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.2" opacity="0.9">
    PROGRAMMABLE INTELLIGENCE · DOMAIN OPTIMIZED · INFINITE ADAPTABILITY
  </text>
</svg> 