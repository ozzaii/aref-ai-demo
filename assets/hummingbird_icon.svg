<?xml version="1.0" encoding="UTF-8"?>
<svg width="40px" height="40px" viewBox="0 0 40 40" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        
        <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <g id="hummingbird" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Body -->
        <path d="M15,18 C16,14 21,13 24,16 C26,18 28,18 28,15 C28,12 25,11 23,12 C20,13 18,15 15,18 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" filter="url(#glow)" />
        
        <!-- Head -->
        <path d="M28,15 C29,14 29.5,14 30,14.5 C30.5,15 30.5,15.5 29,16 C27.5,16.5 28,15.5 28,15 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" />
        
        <!-- Beak -->
        <path d="M30,14.5 L34,14 L30,15 Z" 
              fill="#10B981" stroke="#10B981" stroke-width="0.5" />
        
        <!-- Primary Wing - will be animated -->
        <g id="wing" transform-origin="20px 16px">
            <path class="primaryWing" d="M22,16 C18,12 14,14 15,18 C16,22 20,19 22,16 Z" 
                  fill="url(#wingGradient)" stroke="#8B5CF6" stroke-width="0.5" />
                  
            <!-- Wing details -->
            <path class="wingDetail" d="M18,15 C19,16 20,16 21,15" 
                  fill="none" stroke="#4F46E5" stroke-width="0.4" />
            <path class="wingDetail" d="M17,16 C19,17 20,17 22,16" 
                  fill="none" stroke="#4F46E5" stroke-width="0.4" />
            <path class="wingDetail" d="M16,17 C18,18 20,18 22,17" 
                  fill="none" stroke="#4F46E5" stroke-width="0.4" />
        </g>
        
        <!-- Secondary Wing - smaller, behind primary -->
        <path class="secondaryWing" d="M20,16 C17,14 15,15 16,17 C17,19 19,18 20,16 Z" 
              fill="url(#wingGradient)" stroke="#8B5CF6" stroke-width="0.3" opacity="0.7" />
        
        <!-- Tail -->
        <path d="M15,18 C13,20 10,23 11,24 C12,25 14,22 15,18 Z" 
              fill="#4F46E5" stroke="#6366F1" stroke-width="0.5" />
              
        <!-- Throat/Chest highlight -->
        <path d="M21,14 C22,15 22,16 21,17" 
              fill="none" stroke="#A855F7" stroke-width="0.7" />
    </g>
</svg>