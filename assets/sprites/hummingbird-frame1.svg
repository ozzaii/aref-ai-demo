<?xml version="1.0" encoding="UTF-8"?>
<svg width="40px" height="40px" viewBox="0 0 40 40" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        
        <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <g id="hummingbird" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Body - Frame 1: Slightly elongated during upward wing motion -->
        <path d="M15,18 C16,14 21,12 24,15 C26,17 28,17 28,14 C28,11 25,10 23,11 C20,12 18,14 15,18 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" filter="url(#glow)" />
        
        <!-- Head - Slightly upward -->
        <path d="M28,14 C29,13 29.5,13 30,13.5 C30.5,14 30.5,14.5 29,15 C27.5,15.5 28,14.5 28,14 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" />
        
        <!-- Beak - Slightly upward -->
        <path d="M30,13.5 L34,13 L30,14 Z" 
              fill="#10B981" stroke="#10B981" stroke-width="0.5" />
        
        <!-- Wings - Frame 1: Wings Fully Up -->
        <path class="wing" d="M22,15 C20,10 16,9 15,13 C14,17 18,18 22,15 Z" 
              fill="url(#wingGradient)" stroke="#8B5CF6" stroke-width="0.5" />
        
        <!-- Wing details - More pronounced upward -->
        <path class="wingDetail" d="M18,13 C19,12 20,11 21,10" 
              fill="none" stroke="#4F46E5" stroke-width="0.4" />
              
        <!-- Tail - More upward motion -->
        <path d="M15,18 C13,19 10,22 11,23 C12,24 14,21 15,18 Z" 
              fill="#4F46E5" stroke="#6366F1" stroke-width="0.5" transform="rotate(-5, 15, 18)" />
              
        <!-- Throat/Chest highlight - More stretched -->
        <path d="M21,13 C22,14 22,15 21,16" 
              fill="none" stroke="#A855F7" stroke-width="0.7" />
    </g>
</svg>