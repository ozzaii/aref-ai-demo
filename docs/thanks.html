<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Nanominds.ai</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366F1;
            --primary-dark: #4F46E5;
            --accent-color: #8B5CF6;
            --background-light: #f8f9fa;
            --background-dark: #111827;
            --text-light: #333;
            --text-dark: #eee;
            --card-light: #ffffff;
            --card-dark: #1E293B;
            --shadow-light: 0 10px 40px rgba(99, 102, 241, 0.15);
            --shadow-dark: 0 10px 40px rgba(99, 102, 241, 0.25);
            --transition: all 0.3s ease;
            --glow-light: 0 0 15px rgba(99, 102, 241, 0.5);
            --glow-dark: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-light);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .thank-you-card {
            background: var(--card-light);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            margin: 0 20px;
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        h1 {
            font-weight: 800;
            margin-bottom: 20px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            text-shadow: var(--glow-light);
            letter-spacing: -0.5px;
        }

        p {
            color: #555;
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        
        .cta-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            z-index: -1;
            opacity: 0;
            transition: var(--transition);
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
        }
        
        .cta-button:hover:before {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .thank-you-card {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <h1>Thank You for Your Interest!</h1>
        <p>We've received your inquiry about Nanominds' efficient, programmable AI solutions. Our team will review your information and get back to you shortly.</p>
        <p>In the meantime, feel free to explore more about our technology and capabilities.</p>
        <a href="index.html" class="cta-button">Return to Homepage</a>
    </div>
</body>
</html>
