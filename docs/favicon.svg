<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Rich gradient for nodes -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="70%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </radialGradient>
    
    <!-- Enhanced glow filter -->
    <filter id="elegantGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feFlood flood-color="#64FFDA" flood-opacity="0.6" />
      <feComposite in2="blur" operator="in" />
      <feComposite in="SourceGraphic" />
    </filter>
    
    <!-- Line gradient -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#3D5AFE" />
    </linearGradient>
    
    <!-- Particle system pattern -->
    <pattern id="nanoPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.3" fill="#64FFDA" opacity="0.3" />
      <circle cx="6" cy="4" r="0.2" fill="#3D5AFE" opacity="0.4" />
      <circle cx="8" cy="8" r="0.25" fill="#651FFF" opacity="0.3" />
    </pattern>
    
    <!-- Code pattern -->
    <pattern id="codePattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <text x="0" y="3" font-family="monospace" font-size="2" fill="#64FFDA" opacity="0.2">if</text>
      <text x="0" y="6" font-family="monospace" font-size="2" fill="#3D5AFE" opacity="0.2">fn</text>
      <text x="0" y="9" font-family="monospace" font-size="2" fill="#651FFF" opacity="0.2">{}</text>
    </pattern>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M3,0 L3,3 M0,3 L16,3 M6,3 L6,8 M0,8 L16,8 M12,8 L12,13 M0,13 L16,13" 
        stroke="#64FFDA" stroke-width="0.2" opacity="0.15" stroke-dasharray="0.5,1" />
    </pattern>
  </defs>
  
  <!-- Background elements -->
  <circle cx="16" cy="16" r="16" fill="#111C24" />
  <circle cx="16" cy="16" r="16" fill="url(#nanoPattern)" opacity="0.7" />
  <circle cx="16" cy="16" r="16" fill="url(#codePattern)" opacity="0.3" />
  <circle cx="16" cy="16" r="16" fill="url(#circuitPattern)" opacity="0.2" />
  
  <!-- Programmable node network -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#64FFDA" stroke-width="0.3" opacity="0.4" stroke-dasharray="1 1" />
  
  <!-- Core hexagon background -->
  <path d="M10,16 L13,21.5 L19,21.5 L22,16 L19,10.5 L13,10.5 Z" fill="#111C24" opacity="0.8" filter="url(#elegantGlow)" />
  
  <!-- Tiny programmable model -->
  <rect x="14" y="14" width="4" height="4" rx="0.7" fill="#111C24" stroke="url(#lineGradient)" stroke-width="0.3" opacity="0.9" />
  <path d="M14.5,15 L17.5,15 M14.5,16 L17.5,16 M14.5,17 L17.5,17" stroke="#64FFDA" stroke-width="0.3" opacity="0.9" />
  <text x="14.7" y="18.5" fill="#64FFDA" font-family="monospace" font-size="1.2" opacity="0.9">01</text>
  
  <!-- Domain nodes -->
  <circle cx="10" cy="16" r="2.2" fill="url(#nodeGradient)" filter="url(#elegantGlow)" />
  <circle cx="22" cy="10.5" r="1.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)" />
  <circle cx="22" cy="21.5" r="1.5" fill="url(#nodeGradient)" filter="url(#elegantGlow)" />
  
  <!-- Additional nodes -->
  <circle cx="16" cy="12" r="1" fill="url(#nodeGradient)" filter="url(#elegantGlow)" />
  <circle cx="16" cy="20" r="1" fill="url(#nodeGradient)" filter="url(#elegantGlow)" />
  
  <!-- Connections -->
  <line x1="10" y1="16" x2="22" y2="10.5" stroke="url(#lineGradient)" stroke-width="0.8" />
  <line x1="10" y1="16" x2="22" y2="21.5" stroke="url(#lineGradient)" stroke-width="0.8" />
  <line x1="22" y1="10.5" x2="22" y2="21.5" stroke="url(#lineGradient)" stroke-width="0.8" />
  
  <!-- Additional connections -->
  <line x1="10" y1="16" x2="16" y2="12" stroke="url(#lineGradient)" stroke-width="0.6" />
  <line x1="16" y1="12" x2="22" y2="10.5" stroke="url(#lineGradient)" stroke-width="0.6" />
  <line x1="10" y1="16" x2="16" y2="20" stroke="url(#lineGradient)" stroke-width="0.6" />
  <line x1="16" y1="20" x2="22" y2="21.5" stroke="url(#lineGradient)" stroke-width="0.6" />
</svg> 