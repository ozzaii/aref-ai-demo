<?xml version="1.0" encoding="UTF-8"?>
<svg width="40px" height="40px" viewBox="0 0 40 40" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        
        <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <g id="hummingbird" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Body - Frame 3: Compressed during downward wing motion -->
        <path d="M15,18 C16,15 21,14 24,17 C26,19 28,19 28,16 C28,13 25,12 23,13 C20,14 18,16 15,18 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" filter="url(#glow)" />
        
        <!-- Head - Slightly downward -->
        <path d="M28,16 C29,15 29.5,15 30,15.5 C30.5,16 30.5,16.5 29,17 C27.5,17.5 28,16.5 28,16 Z" 
              fill="url(#bodyGradient)" stroke="#4F46E5" stroke-width="0.5" />
        
        <!-- Beak - Slightly downward -->
        <path d="M30,15.5 L34,15 L30,16 Z" 
              fill="#10B981" stroke="#10B981" stroke-width="0.5" />
        
        <!-- Wings - Frame 3: Wings Fully Down -->
        <path class="wing" d="M22,17 C18,20 14,21 15,19 C16,17 19,18 22,17 Z" 
              fill="url(#wingGradient)" stroke="#8B5CF6" stroke-width="0.5" />
        
        <!-- Wing details - More pronounced downward -->
        <path class="wingDetail" d="M18,18 C19,18 20,18 21,18" 
              fill="none" stroke="#4F46E5" stroke-width="0.4" />
              
        <!-- Tail - Downward motion -->
        <path d="M15,18 C13,20 10,23 11,24 C12,25 14,22 15,18 Z" 
              fill="#4F46E5" stroke="#6366F1" stroke-width="0.5" transform="rotate(5, 15, 18)" />
              
        <!-- Throat/Chest highlight - Compressed -->
        <path d="M21,15 C22,16 22,17 21,18" 
              fill="none" stroke="#A855F7" stroke-width="0.7" />
    </g>
</svg>